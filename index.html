<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/coffee/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/coffee/apple-touch-icon-180.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#F4EFE6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1613" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bruna" />
    <meta
      name="description"
      content="A warm, Nordic espresso companion for the Fellow Opus + Lelit Anna PL41EM."
    />
    <title>Bruna — Coffee Dial-In</title>
    <script>
      window.__brunaStart = Date.now();
    </script>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #f4efe6;
        transition: opacity 0.45s ease;
      }
      #splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash .sp-mark {
        width: 104px;
        height: 104px;
        animation: sp-pop 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #splash .sp-crema {
        transform-box: fill-box;
        transform-origin: center;
        animation: sp-breathe 2.4s ease-in-out infinite;
      }
      #splash .sp-name {
        font-family: ui-serif, "New York", "Iowan Old Style", Palatino, Georgia,
          serif;
        font-size: 30px;
        letter-spacing: -0.01em;
        color: #2b2622;
        opacity: 0;
        animation: sp-fade 0.6s ease 0.25s forwards;
      }
      #splash .sp-tag {
        font-family: ui-sans-serif, -apple-system, system-ui, sans-serif;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #b4693e;
        opacity: 0;
        animation: sp-fade 0.6s ease 0.45s forwards;
      }
      @keyframes sp-pop {
        from {
          opacity: 0;
          transform: scale(0.86);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes sp-fade {
        to {
          opacity: 1;
        }
      }
      @keyframes sp-breathe {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.9;
        }
        50% {
          transform: scale(1.12);
          opacity: 1;
        }
      }
      @media (prefers-color-scheme: dark) {
        #splash {
          background: #1a1613;
        }
        #splash .sp-name {
          color: #f0e8dc;
        }
        #splash .sp-tag {
          color: #cd8055;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .sp-mark,
        #splash .sp-crema,
        #splash .sp-name,
        #splash .sp-tag {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg class="sp-mark" viewBox="0 0 100 100" aria-hidden="true">
        <rect x="0" y="0" width="100" height="100" rx="24" fill="#B4693E" />
        <circle cx="50" cy="50" r="35.5" fill="#96522e" />
        <circle cx="50" cy="50" r="33.5" fill="#F1E7D6" />
        <circle cx="50" cy="50" r="29.5" fill="#a95f38" />
        <circle cx="50" cy="50" r="26" fill="#3A2A20" />
        <circle class="sp-crema" cx="45.2" cy="44.8" r="11.5" fill="#C48E5C" />
      </svg>
      <div class="sp-name">Bruna</div>
      <div class="sp-tag">Coffee, dialed in</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
